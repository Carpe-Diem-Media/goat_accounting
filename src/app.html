<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KQ3W4DKN");
    </script>
    <!-- End Google Tag Manager -->
    <!-- GA4 should be configured and fired from GTM to avoid duplicate tracking. -->
    <meta name="theme-color" content="#173b63" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png?v=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=1.0" />
    <meta property="og:image" content="%sveltekit.assets%/images/seo/goat-accounting-og.png?v=1.0">
    <meta property="twitter:image" content="%sveltekit.assets%/images/seo/goat-accounting-og.png?v=1.0">
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="dns-prefetch" href="https://wa.me" />
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": { "href_matches": ["/services", "/contact"] },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
    <script>
      (function () {
        const stored = localStorage.getItem("theme");
        if (
          stored === "dark" ||
          (!stored && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KQ3W4DKN" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
