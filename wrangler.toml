name = "goat-accounting"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2026-02-27"
compatibility_flags = ["nodejs_compat"] # CRITICAL: Added to prevent 500 runtime errors

# Preview environment (local dev and branch previews)
[[env.preview.kv_namespaces]]
binding = "BOOKING_STATE"
id = "4d81337b6bda43608aec68ff115720e9" # Use the same ID to prevent build crashes

[env.preview.vars]
CALENDAR_PROVIDER = "google"
GOOGLE_CALENDAR_ID = "primary"
CALENDAR_EVENT_DURATION_MINUTES = "60"
RESEND_FROM_EMAIL = "Goat Accounting <noreply@goataccounting.co.za>"
ADVISOR_EMAIL = "rossouw@goataccounting.co.za"
SUPABASE_URL = "https://pxguvhxfvaqtdvqwgbyd.supabase.co"
SUPABASE_LEADS_TABLE = "leads"

# Production environment (live site)
[[env.production.kv_namespaces]]
binding = "BOOKING_STATE"
id = "4d81337b6bda43608aec68ff115720e9"

[env.production.vars]
CALENDAR_PROVIDER = "google"
GOOGLE_CALENDAR_ID = "primary"
CALENDAR_EVENT_DURATION_MINUTES = "60"
RESEND_FROM_EMAIL = "Goat Accounting <noreply@goataccounting.co.za>"
ADVISOR_EMAIL = "rossouw@goataccounting.co.za"
SUPABASE_URL = "https://pxguvhxfvaqtdvqwgbyd.supabase.co"
SUPABASE_LEADS_TABLE = "leads"
